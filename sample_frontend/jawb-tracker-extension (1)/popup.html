<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Jawb Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__brand-mark">JT</span>
      <span class="topbar__brand-name">Jawb Tracker</span>
    </div>
    <button class="icon-btn" id="openOptionsBtn" title="Settings">⚙</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="parse">Parse</button>
    <button class="tab-btn" data-view="postings">Postings</button>
  </nav>

  <section class="view active" id="view-parse">
    <div id="clipboardStrip"></div>

    <form id="parseForm">
      <div class="field">
        <label>Job posting text</label>
        <div class="field-with-btn">
          <textarea id="contentInput" rows="7" placeholder="Paste the job posting here…"></textarea>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" id="pasteBtn" style="align-self: flex-start;">
          Paste from clipboard
        </button>
      </div>

      <div class="field">
        <label>Link</label>
        <input type="url" id="linkInput" placeholder="https://…" />
        <span class="hint">Filled in automatically from the current tab.</span>
      </div>

      <div class="field">
        <div class="checkbox-line">
          <input type="checkbox" id="scoreCheckbox" />
          <label for="scoreCheckbox" style="text-transform:none;font-weight:400;font-size:12.5px;">
            Score with main resume
          </label>
        </div>
        <span class="hint" id="mainResumeHint"></span>
      </div>

      <button type="submit" class="btn btn--accent btn--block" id="submitBtn">Parse job posting</button>
      <p class="hint" style="margin-top:8px;">
        Parsing calls an LLM and is limited to 3 requests per minute.
      </p>
    </form>

    <div id="resultCard"></div>
  </section>

  <section class="view" id="view-postings">
    <div class="toolbar">
      <h3>Job postings</h3>
      <button class="icon-btn" id="refreshPostingsBtn" title="Refresh">↻</button>
    </div>
    <div id="postingsTableWrap">
      <div class="loading-line">Loading…</div>
    </div>
  </section>

  <div class="footer-link">
    <a href="#" id="openAppLink" target="_blank">Open full tracker →</a>
  </div>

  <div id="toastHost"></div>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
